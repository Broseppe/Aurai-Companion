          test -f index.html
          test -f android/app/build.gradle
          echo "Aurai Companion source restored."

      - name: Save app source to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- ':!.github/workflows/**'
          if git diff --cached --quiet; then
            echo "Project source is already present in the repository."
            exit 0
          fi
          git commit -m "Install Aurai Companion v2.1"
          if ! git push origin HEAD:"${GITHUB_REF_NAME}"; then
            echo "::warning::The APK can still be built, but GitHub did not allow the workflow to save source files back to the repository."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sync current web app into Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/www
          cp index.html styles.css data.js app.js icon.svg icon-192.png icon-512.png manifest.webmanifest sw.js android/app/src/main/assets/www/

      - name: Build Android APK
        shell: bash
        working-directory: android
        run: gradle :app:assembleDebug

      - name: Prepare APK download
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Aurai-Companion-Android.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: Aurai-Companion-Android
          path: Aurai-Companion-Android.apk
          retention-days: 30

      - name: Finished
        shell: bash
        run: |
          echo "Aurai Companion APK built successfully."
          echo "Open this workflow run and download the Aurai-Companion-Android artifact."

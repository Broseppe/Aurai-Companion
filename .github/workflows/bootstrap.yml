name: Install Aurai Companion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify phone upload
        shell: bash
        run: |
          set -euo pipefail
          test -f aurai-companion-source.tar.gz || { echo "Missing aurai-companion-source.tar.gz in the repository root."; exit 1; }
          echo "4b1692584a5edbc5636d3caf9c7a3afbdaab7c4c134855d15445dc3e3ca3a82e  aurai-companion-source.tar.gz" | sha256sum -c -
          tar -tzf aurai-companion-source.tar.gz >/dev/null

      - name: Install project files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aurai-companion
          tar -xzf aurai-companion-source.tar.gz -C /tmp/aurai-companion
          rsync -a /tmp/aurai-companion/ ./
          test -f index.html
          test -f .github/workflows/build-android.yml
          test -f .github/workflows/pages.yml

      - name: Commit Aurai Companion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aurai Companion is already installed."
            exit 0
          fi
          git commit -m "Install Aurai Companion v2.1"
          git push

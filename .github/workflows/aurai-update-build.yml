name: Aurai Companion Update & Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply phone update archive if present
        shell: bash
        run: |
          set -euo pipefail

          if [ -f aurai-update.tar.gz ]; then
            echo "Applying aurai-update.tar.gz..."
            tar -tzf aurai-update.tar.gz >/dev/null
            tar -xzf aurai-update.tar.gz -C "$GITHUB_WORKSPACE"
            rm -f aurai-update.tar.gz

            test -f index.html
            test -f app.js
            test -f android/app/build.gradle

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Never let an app update overwrite Actions workflows.
            git add --all -- ':!.github/workflows/**'

            if git diff --cached --quiet; then
              echo "Update archive contained no repository changes."
            else
              git commit -m "Update Aurai Companion"
              git push origin HEAD:"${GITHUB_REF_NAME}"
              echo "Update saved to repository."
            fi
          else
            echo "No aurai-update.tar.gz found. Building the current repository version."
          fi

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f data.js
          test -f app.js
          test -f android/app/build.gradle
          echo "Project files verified."

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found on the GitHub runner."
            exit 1
          fi

          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sync web app into Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/www
          rm -rf android/app/src/main/assets/www/*
          cp index.html styles.css data.js app.js icon.svg icon-192.png icon-512.png manifest.webmanifest sw.js android/app/src/main/assets/www/

      - name: Build Android APK
        shell: bash
        working-directory: android
        run: gradle :app:assembleDebug

      - name: Prepare APK download
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Aurai-Companion-Android.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: Aurai-Companion-Android
          path: Aurai-Companion-Android.apk
          retention-days: 30

      - name: Finished
        shell: bash
        run: |
          echo "Aurai Companion build completed."
          echo "Download the Aurai-Companion-Android artifact from this workflow run."
